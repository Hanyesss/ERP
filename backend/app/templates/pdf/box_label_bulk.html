<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @page { size: 80mm 60mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: "DejaVu Sans", Arial, sans-serif; }
  body { background: #fff; }

  .label {
    display: flex;
    flex-direction: row;
    width: 80mm;
    height: 60mm;
    padding: 1.5mm;
    gap: 1.5mm;
    page-break-after: always;
    overflow: hidden;
  }
  .label:last-child { page-break-after: auto; }

  .qr-col {
    flex: 0 0 40mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-col img {
    width: 40mm;
    height: 40mm;
    display: block;
    image-rendering: pixelated;
  }

  .divider {
    width: 0.4pt;
    background: #888;
    align-self: stretch;
    flex-shrink: 0;
    margin: 1mm 0;
  }

  .info-col {
    flex: 1;
    padding-left: 1mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    min-width: 0;
  }

  .box-code {
    font-size: 9pt;
    font-weight: bold;
    letter-spacing: 0.3px;
    word-break: break-all;
    line-height: 1.15;
    border-bottom: 0.6pt solid #000;
    padding-bottom: 0.8mm;
  }

  .field-client .lbl { font-size: 5pt; color: #666; display: block; line-height: 1.1; }
  .field-client .val { font-size: 10pt; font-weight: bold; line-height: 1.15; }

  .field .lbl { font-size: 5pt; color: #666; display: block; line-height: 1.1; }
  .field .val { font-size: 8.5pt; font-weight: bold; line-height: 1.2; }

  .item-name {
    font-size: 7.5pt;
    font-weight: bold;
    color: #111;
    border-top: 0.4pt dashed #999;
    padding-top: 0.8mm;
    word-break: break-word;
    line-height: 1.2;
    overflow: hidden;
  }
</style>
</head>
<body>
{% for lbl in labels %}
<div class="label">
  <div class="qr-col">
    <img src="{{ lbl.qr_image }}" alt="QR" />
  </div>
  <div class="divider"></div>
  <div class="info-col">
    <div class="box-code">{{ lbl.box_code }}</div>
    <div class="field-client">
      <span class="lbl">Клиент / 客户</span>
      <span class="val">{{ lbl.client_code }}</span>
    </div>
    <div class="field">
      <span class="lbl">Вес / 重量</span>
      <span class="val">{{ lbl.weight }} кг</span>
    </div>
    <div class="field">
      <span class="lbl">Объём / 体积</span>
      <span class="val">{{ lbl.volume }} м³</span>
    </div>
    <div class="field">
      <span class="lbl">Плотн. / 密度</span>
      <span class="val">{{ lbl.density }}</span>
    </div>
    <div class="item-name">{{ lbl.item_name }}</div>
  </div>
</div>
{% endfor %}
</body>
</html>
