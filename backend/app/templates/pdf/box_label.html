<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: 80mm 60mm;
    margin: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DejaVu Sans", Arial, sans-serif; }
  body { width: 80mm; height: 60mm; overflow: hidden; background: #fff; }

  .label {
    display: flex;
    flex-direction: row;
    width: 80mm;
    height: 60mm;
    padding: 2mm;
    gap: 2mm;
  }

  /* QR — левая колонка, ~42мм чтобы читался при 203 DPI */
  .qr-col {
    flex: 0 0 42mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-col img {
    width: 42mm;
    height: 42mm;
    display: block;
    image-rendering: pixelated;
  }

  /* Тонкий разделитель */
  .divider {
    width: 0.3pt;
    background: #bbb;
    align-self: stretch;
    flex-shrink: 0;
  }

  /* Текстовая часть — правая колонка */
  .info-col {
    flex: 1;
    padding-left: 1.5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    min-width: 0;
  }

  .box-code {
    font-size: 7pt;
    font-weight: bold;
    letter-spacing: 0.2px;
    border-bottom: 0.5pt solid #000;
    padding-bottom: 1mm;
    margin-bottom: 1mm;
    word-break: break-all;
    line-height: 1.2;
  }

  .field {
    margin-bottom: 0.7mm;
    line-height: 1.2;
  }
  .field .lbl {
    font-size: 5.5pt;
    color: #777;
    display: block;
  }
  .field .val {
    font-size: 7pt;
    font-weight: bold;
  }

  .item-name {
    font-size: 6.5pt;
    color: #222;
    margin-top: 1mm;
    padding-top: 1mm;
    border-top: 0.3pt dashed #aaa;
    word-break: break-word;
    line-height: 1.2;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="label">
  <div class="qr-col">
    <img src="{{ qr_image }}" alt="QR" />
  </div>
  <div class="divider"></div>
  <div class="info-col">
    <div class="box-code">{{ box_code }}</div>
    <div class="field">
      <span class="lbl">Клиент / 客户</span>
      <span class="val">{{ client_code }}</span>
    </div>
    <div class="field">
      <span class="lbl">Вес / 重量</span>
      <span class="val">{{ weight }} кг</span>
    </div>
    <div class="field">
      <span class="lbl">Объём / 体积</span>
      <span class="val">{{ volume }} м³</span>
    </div>
    <div class="field">
      <span class="lbl">Плотн. / 密度</span>
      <span class="val">{{ density }}</span>
    </div>
    <div class="item-name">{{ item_name }}</div>
  </div>
</div>
</body>
</html>
